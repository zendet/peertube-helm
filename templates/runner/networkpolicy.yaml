{{- if .Values.runner.enabled -}}
{{- if .Values.runner.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ template "peertube.runner.name" . }}
  namespace: {{ template "peertube.namespace" . }}
  labels:
    {{- include "peertube.runner.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "peertube.runner.matchLabels" . | nindent 6 }}
  {{- with .Values.runner.networkPolicy.ingress }}
  ingress:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.runner.networkPolicy.egress }}
  egress:
  {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}